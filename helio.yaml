esphome:
  name: helio-bridge
  friendly_name: Helio Strap Bridge

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

time:
  - platform: sntp
    id: sntp_time

external_components:
  - source:
      type: local
      path: components

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

ble_client:
  - mac_address: <your device mac address here>
    id: helio
    auto_connect: false

zepp_helio:
  id: zepp
  ble_client_id: helio
  auth_key: "<your auth key here>"
  time_id: sntp_time
  # Activity-fetch control transport:
  #   legacy  — unencrypted writes to char 0x0004 (Mi Band 4 backdoor).
  #             All 8 fetch types verified working on Helio Strap via
  #             amazfit/zepp_all_legacy.py. Simpler, skips encryption
  #             on the hot path. Recommended for Helio.
  #   zeppos  — chunked-2021 endpoint 0x004B, encrypted (matches
  #             Gadgetbridge's ZeppOsActivityFetchService). Use this if
  #             future firmware drops the legacy backdoor.
  control_path: legacy
  # Hard safety cap on how far back we go when the NVS-persisted
  # last_import_ts for a type has stale / corrupted state. Steady-
  # state windows are driven by last_import_ts, not this value.
  max_lookback: 24h
  # First-run backfill window — how far back we go when NVS has no
  # prior last_import_ts for a type (fresh flash, factory reset).
  # Every record in this window is bucketed into 5-min aggregates and
  # pushed to HA via recorder.import_statistics through the trigger
  # below.
  first_run_lookback: 24h

  # Per-bucket statistic trigger: fires once per 5-min aggregate with
  # (type, start_iso, mean_value, min_value, max_value, count). Wire
  # each bucket into HA's external statistics store so historical
  # charts back-populate on first run.
  on_statistic_ready:
    - homeassistant.service:
        service: recorder.import_statistics
        data:
          statistic_id: !lambda 'return std::string("esphome:helio_") + type;'
          source: esphome
          name: !lambda 'return std::string("Helio ") + type;'
          has_mean: "true"
          has_sum: "false"
        data_template:
          # data_template values get Jinja2-rendered by HA. Wrapping
          # the list in {{ ... }} makes HA evaluate it as a Python
          # literal and pass it to recorder.import_statistics as a
          # real list[dict], which is what the service expects.
          stats: !lambda |-
            char buf[256];
            snprintf(buf, sizeof(buf),
              "{{ [{'start':'%s','mean':%.3f,'min':%.3f,'max':%.3f}] }}",
              start.c_str(), mean_value, min_value, max_value);
            return std::string(buf);

sensor:
  - platform: zepp_helio
    zepp_helio_id: zepp
    temperature:
      name: "Helio Skin Temperature"
    heart_rate:
      name: "Helio Heart Rate"
    resting_heart_rate:
      name: "Helio Resting HR"
    max_heart_rate:
      name: "Helio Max HR"
    steps:
      name: "Helio Steps (last min)"
    stress:
      name: "Helio Stress"
    spo2:
      name: "Helio SpO2"
    respiratory_rate:
      name: "Helio Respiratory Rate"
    hrv:
      name: "Helio HRV"
    battery_level:
      name: "Helio Battery"
    sample_count:
      name: "Helio Last Fetch Sample Count"

binary_sensor:
  - platform: zepp_helio
    zepp_helio_id: zepp
    worn:
      name: "Helio Worn"
    charging:
      name: "Helio Charging"

text_sensor:
  - platform: zepp_helio
    zepp_helio_id: zepp
    sleep_stage:
      name: "Helio Sleep Stage"
    activity_kind:
      name: "Helio Activity Kind"

interval:
  - interval: 15min
    then:
      - lambda: |-
          id(zepp).trigger_fetch();
